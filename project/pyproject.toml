[project]
name = "germany-job-monitor"
version = "1.0.0"
description = "Production-grade Germany Product Designer job monitor with Telegram notifications"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "loguru>=0.7",
    "lxml>=5.2",
    "playwright>=1.45",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "tenacity>=8.3",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-playwright>=0.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["browser: launches real Chromium (slow)"]
